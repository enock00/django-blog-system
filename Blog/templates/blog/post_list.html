{% extends 'blog/base.html' %}

{% block content %}

<div class="posts-container">
{% for post in posts %}
<div class="post-card">

    <h2>
        <a href="{% url 'post_detail' post.id %}">
            {{ post.title }}
        </a>
    </h2>

    <p class="author">
        By {{ post.author.username }}
    </p>

    <p class="date">
        {{ post.created_at }}
    </p>

    <p>
        {{ post.content|truncatewords:30 }}
    </p>

</div>
{% empty %}
    <p>No posts available.</p>
{% endfor %}

</div>
{% endblock %}
