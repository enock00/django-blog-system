{% extends 'blog/base.html' %}

{% block content %}

<div class="profile-card">

    <div class="profile-avatar">
        <i class="fa-solid fa-user"></i>
    </div>

    <h1>{{ user.username }}</h1>

    <p class="profile-email">
        {{ user.email }}
    </p>

    <div class="profile-info">

        <div class="info-box">
            <h3>Posts</h3>
            <p>{{ user.post_set.count }}</p>
        </div>

        <div class="info-box">
            <h3>Comments</h3>
            <p>{{ user.comment_set.count }}</p>
        </div>

        <div class="info-box">
            <h3>Member Since</h3>
            <p>{{ user.date_joined|date:"M Y" }}</p>
        </div>

    </div>

</div>

{% endblock %}
