{% extends 'blog/base.html' %}

{% block content %}

<div class="delete-box">

    <h2>
        Delete "{{ post.title }}"?
    </h2>

    <p>
        This action cannot be undone.
    </p>

    <br>

    <form method="post">
        {% csrf_token %}

        <button type="submit"
                class="btn btn-danger">
            Delete
        </button>

        <a href="{% url 'post_detail' post.id %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
